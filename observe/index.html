<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142c2e">
  <title>モンスター観察 | Roll-by-Blow</title>
  <link rel="stylesheet" href="observe.css?v=0.3.25">
  <script src="observe.js?v=0.3.25" defer></script>
</head>
<body>
  <div id="camera-host" aria-hidden="true"></div>
  <header class="site-header">
    <a class="wordmark" href="../">Roll-by-Blow</a>
    <a class="button secondary" href="../?mode=capture">捕獲モードへ</a>
  </header>
  <main>
    <section class="intro" id="intro">
      <img class="mascot" src="../icons/monster-face.svg" alt="" width="68" height="68">
      <p class="eyebrow" id="eyebrow">FIELD NOTE / 01</p>
      <h1 id="title">モンスター観察</h1>
      <p id="intro-text">観察用紙を映すと、ミニモンスターが現れます。スマホを動かして、いろいろな角度から見てみよう。</p>
      <button class="button primary" id="start-camera" type="button">カメラを許可して始める</button>
      <nav class="intro-links" aria-label="観察のメニュー">
        <a href="print.html" id="print-link">観察用紙を印刷</a>
        <a href="?mode=face" id="alternate-link">モンスターに変身</a>
      </nav>
      <small id="engine-label">AR.js / 画像追跡</small>
    </section>
    <section class="live-panel" id="live-panel" hidden aria-label="カメラ操作">
      <div class="live-title">
        <strong id="live-title">モンスター観察</strong>
        <span class="badge" id="phase">起動中</span>
      </div>
      <p id="live-hint">観察用紙の全体を映してください。</p>
      <div class="pose-controls" id="pose-controls">
        <button type="button" class="button primary" id="turn" disabled>向きを変える</button>
        <button type="button" class="button secondary" id="defend" disabled>防御を見る</button>
      </div>
      <nav class="live-links" aria-label="ほかのモード">
        <a href="?mode=face" id="live-alternate">モンスターに変身</a>
        <button type="button" id="stop-camera">カメラを終了</button>
      </nav>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
