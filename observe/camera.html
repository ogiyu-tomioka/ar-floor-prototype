<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Roll-by-Blow カメラ</title>
  <style>
    html,body,#stage { margin:0; position:fixed; inset:0; overflow:hidden; }
    body { background:#142c2e; }
    a-scene { width:100%; height:100%; }
    #error-popup { display:none; }
    body[data-mode="paper"] {
      width:100% !important;
      height:100% !important;
      margin:0 !important;
    }
    body[data-mode="paper"] #stage,
    body[data-mode="paper"] #arjs-video {
      position:fixed !important;
      inset:auto !important;
      left:50% !important;
      top:50% !important;
      width:var(--camera-width, 100vw) !important;
      height:var(--camera-height, 100vh) !important;
      margin:0 !important;
      transform:translate(-50%, -50%);
    }
    body[data-mode="paper"] #arjs-video { z-index:0 !important; object-fit:fill; }
    body[data-mode="paper"] #stage { z-index:1; }
    body[data-mode="paper"] #stage canvas.a-canvas {
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      margin:0 !important;
    }
    body[data-mode="face"] #stage { isolation:isolate; }
    body[data-mode="face"] #stage video {
      z-index:0 !important;
      width:100%;
      height:100%;
      object-fit:cover;
    }
    body[data-mode="face"] #stage a-scene { position:absolute !important; z-index:1; }
  </style>
  <script src="nft-pose.js?v=0.3.28" defer></script>
  <script src="camera.js?v=0.3.28" defer></script>
</head>
<body>
  <div id="stage"></div>
  <template id="paper-scene">
    <a-scene embedded vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
      renderer="antialias:false; precision:medium; colorManagement:true">
      <a-entity light="type:ambient; color:#ffffff; intensity:0.9"></a-entity>
      <a-entity light="type:directional; color:#fff3de; intensity:1.1" position="-1 2 1"></a-entity>
      <a-nft id="paper-anchor" type="nft" hit-testing-enabled="false">
        <a-entity id="paper-center" position="67.5 0 -90">
          <a-circle radius="25" rotation="-90 0 0" position="0 .2 0"
            material="shader:flat; color:#132e32; opacity:.33; transparent:true"></a-circle>
          <a-entity id="monster-heading">
            <a-entity id="monster-rig" scale="95 95 95"></a-entity>
          </a-entity>
        </a-entity>
      </a-nft>
      <a-entity camera="near:12; far:3500" look-controls="enabled:false" wasd-controls="enabled:false"></a-entity>
    </a-scene>
  </template>
  <template id="face-scene">
    <a-scene embedded mindar-face="uiLoading:no; uiScanning:no; uiError:no" rbb-companion
      vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
      renderer="antialias:false; precision:medium; colorManagement:true">
      <a-camera active="false" look-controls="enabled:false"></a-camera>
      <a-entity light="type:ambient; color:#fff; intensity:1.2"></a-entity>
      <a-entity light="type:directional; color:#fff3de; intensity:1.6" position="-1 2 1"></a-entity>
      <a-entity mindar-face-target="anchorIndex:152">
        <a-entity id="shoulder-monster" position=".92 -.47 -.28" scale="1.05 1.05 1.05" visible="false"></a-entity>
      </a-entity>
      <a-entity mindar-face-target="anchorIndex:10">
        <a-entity id="head-monster" position="0 .04 -.13" scale=".88 .88 .88" visible="false"></a-entity>
      </a-entity>
    </a-scene>
  </template>
</body>
</html>
